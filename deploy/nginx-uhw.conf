# UrbanHeat Watch on one domain: the web app at /, the API at /api/ and /health.
# Copy to /etc/nginx/sites-available/uhw, replace YOUR_DOMAIN, then run certbot (see deploy/DEPLOY.md).

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/uhw;
    index index.html;

    # API (Node, port 8787). Streaming AI chat needs buffering off.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
    }

    # Hashed build files never change, so cache them for a long time.
    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (/home, /login, ...) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
