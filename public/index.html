<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="NASA-satellite heat map, live heat-stress alerts and an AI heat assistant for Southeast Asian cities." />

    <!-- Install as an app ("Add to Home Screen") -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FBF1E4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UrbanHeat" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link preview card when the link is shared (WhatsApp, Telegram, etc.). __SITE_URL__ is filled in by deploy/setup.sh. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UrbanHeat Watch" />
    <meta property="og:title" content="UrbanHeat Watch" />
    <meta property="og:description" content="Know the heat on your street: NASA satellite heat map, live alerts and an AI heat assistant." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
